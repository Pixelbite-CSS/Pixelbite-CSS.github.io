<component path="./docs_side/object.html" class="top-0 pos-sticky h-auto minW-200px of-hidden ofy-scroll" object:object="
${`
    let version = pixelbite.query.v || pixelbite.version
    let language = pixelbite.query.lang || "English"
    // let firstUrl = "https://api.github.com/repos/Pixelbite-CSS/docs-repo/contents/"
    let firstUrl = "https://pixelbite-css.github.io/docs-repo/"
    // let url = firstUrl + version + "/" + language + "?ref=main"
    let url = firstUrl + version + "/" + language + "/object.json"
    if (urlExists(url)) {
        return url + '" lang="' + language + '" v="' + version + '"'
    } else {
        return 'https://pixelbite-css.github.io/docs-repo/1.7/English/object.json" lang="English" v="1.7"'
    }
`}
"></component>
